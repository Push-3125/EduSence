[mypy]
python_version = 3.12
mypy_path = .
ignore_missing_imports = True
follow_imports = silent
disable_error_code = import-untyped
exclude = (tests|scripts|migrations)/

[mypy-celery]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-docx]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-minio]
ignore_missing_imports = True

[mypy-minio.*]
ignore_missing_imports = True

[mypy-pytesseract]
ignore_missing_imports = True

[mypy-pytesseract.*]
ignore_missing_imports = True
