name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Test (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Mypy Type Check
        run: mypy .

      - name: Run Pytest Test Suite
        run: pytest -v

      - name: Run Architecture Boundaries & Workflow Validation
        working-directory: .
        run: python workflow/workflow.py validate --ci

  frontend-checks:
    name: Frontend Lint & Type Check (Vue 3 + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vue TypeScript Type Check
        run: npm run type-check

      - name: Run Frontend Lint Check
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit -- --run
